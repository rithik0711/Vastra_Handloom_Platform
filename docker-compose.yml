services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: vastra-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: vastra-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
